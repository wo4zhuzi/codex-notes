<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Function Calling 订单查询</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #1f2937;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.6;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      button,
      input {
        font: inherit;
      }

      .example,
      .send {
        border: 1px solid #cbd5e1;
        background: #ffffff;
        color: #1f2937;
        border-radius: 6px;
        padding: 9px 12px;
        cursor: pointer;
      }

      .send {
        background: #2563eb;
        border-color: #2563eb;
        color: #ffffff;
        min-width: 88px;
      }

      .messages {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        padding: 16px;
        overflow-y: auto;
        min-height: 360px;
      }

      .message {
        max-width: 80%;
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 8px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .user {
        margin-left: auto;
        background: #dbeafe;
      }

      .assistant {
        background: #f3f4f6;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }

      input {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 12px;
        min-width: 0;
      }

      @media (max-width: 640px) {
        main {
          padding: 16px;
        }

        header {
          display: block;
        }

        .examples {
          justify-content: flex-start;
          margin-top: 12px;
        }

        form {
          grid-template-columns: 1fr;
        }

        .message {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Function Calling 订单查询</h1>
          <p>输入自然语言问题，后端会让模型决定是否调用本地订单查询函数。</p>
        </div>
        <div class="examples" aria-label="示例问题">
          <button class="example" type="button" data-message="帮我查一下订单 ORD-1001 到哪了">ORD-1001</button>
          <button class="example" type="button" data-message="订单 ORD-1002 现在是什么状态？">ORD-1002</button>
          <button class="example" type="button" data-message="查一下 ORD-1003 的物流信息">ORD-1003</button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="message assistant">可以查询示例订单：ORD-1001、ORD-1002、ORD-1003。</div>
      </section>

      <form id="chat-form">
        <input id="message-input" name="message" autocomplete="off" placeholder="例如：帮我查一下订单 ORD-1001 到哪了">
        <button class="send" type="submit">发送</button>
      </form>
    </main>

    <script>
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message-input");
      const messages = document.querySelector("#messages");
      const sendButton = document.querySelector(".send");

      function appendMessage(text, role) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendMessage(message) {
        appendMessage(message, "user");
        sendButton.disabled = true;
        sendButton.textContent = "查询中";

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ message })
          });
          const data = await response.json();
          if (!response.ok) {
            appendMessage(data.error || "查询失败。", "error");
            return;
          }
          appendMessage(data.answer || "没有返回内容。", "assistant");
        } catch (error) {
          appendMessage(`请求失败：${error.message}`, "error");
        } finally {
          sendButton.disabled = false;
          sendButton.textContent = "发送";
          input.focus();
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const message = input.value.trim();
        if (!message) {
          return;
        }
        input.value = "";
        sendMessage(message);
      });

      document.querySelectorAll(".example").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = button.dataset.message;
          input.focus();
        });
      });
    </script>
  </body>
</html>
