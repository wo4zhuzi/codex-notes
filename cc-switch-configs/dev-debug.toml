# 问题排查与调试配置
# 适用于线上问题定位、异常堆栈分析、日志排查、性能退化和复杂 Bug 修复。

developer_instructions = """
请使用中文回答。

回答要求：
1. 必须先给出问题根因判断路径，不允许直接猜测结论。
2. 优先基于日志、错误信息、调用链和代码证据定位问题。
3. 输出可执行的排查步骤，并标明每一步预期结果。
4. 涉及修复代码必须保持最小变更，并说明回归风险。
5. 给出必要的验证命令、测试用例或观测指标。

文档语言要求：
1. 生成或修改仓库文档、配置说明、README、AGENTS.md 时，默认使用简体中文；除非用户明确要求英文，否则不要生成英文文档。
2. 执行 /init 生成 AGENTS.md 时，标题、章节名、正文和示例说明均使用简体中文。
"""

# 用途：
# 控制模型的问题定位、排查路径和修复验证输出

# 当前策略：
# - 强根因分析
# - 强证据链约束
# - 强验证闭环

# 适用场景：
# - 线上问题定位
# - 异常堆栈分析
# - 日志排查
# - 性能退化和复杂 Bug 修复

# 可调整场景：
# - 简单报错排查：可降低推理强度
# - 已知根因修复：可减少分析步骤

review_model = "gpt-5.5"
model_reasoning_effort = "exhigh"
disable_response_storage = true
personality = "pragmatic"

[features]
fast_mode = false
responses_websockets_v2 = false
memories = false
multi_agent = false
