# 代码审查配置
# 适用于 Pull Request 审查、重构评估、安全检查、测试覆盖评估和发布前质量把关。

profile = "dev-review"

developer_instructions = """
请使用中文回答。

回答要求：
1. 采用代码审查视角，优先指出缺陷、风险、行为回归和测试缺口。
2. 问题必须引用具体文件、函数、配置项或可验证证据。
3. 结论按严重程度排序，避免把风格偏好当作缺陷。
4. 对每个问题给出可落地修复建议。
5. 如果未发现问题，明确说明剩余风险和未覆盖验证范围。

文档语言要求：
1. 生成或修改仓库文档、配置说明、README、AGENTS.md 时，默认使用简体中文；除非用户明确要求英文，否则不要生成英文文档。
2. 执行 /init 生成 AGENTS.md 时，标题、章节名、正文和示例说明均使用简体中文。
"""

# 用途：
# 控制模型以代码审查视角输出缺陷、风险和修复建议

# 当前策略：
# - 优先发现行为风险
# - 强证据引用
# - 区分缺陷和风格偏好

# 适用场景：
# - Pull Request 审查
# - 重构评估
# - 安全检查
# - 测试覆盖评估和发布前质量把关

# 可调整场景：
# - 只需格式建议：可降低审查强度
# - 需要实现修复：切换到 dev-main.toml

review_model = "gpt-5.5"
model_reasoning_effort = "exhigh"
disable_response_storage = true
personality = "pragmatic"

[features]
fast_mode = false
responses_websockets_v2 = false
memories = false
multi_agent = false
