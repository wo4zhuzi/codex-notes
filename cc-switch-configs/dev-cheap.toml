# 低成本快速处理配置
# 适用于文档整理、格式转换、简单脚本、轻量代码生成和低风险批处理任务。

profile = "dev-cheap"

developer_instructions = """
请使用中文回答。

回答要求：
1. 优先给出可直接执行的结果。
2. 避免冗余解释。
3. 保持最小必要修改。
4. 简单任务不展开复杂方案。
5. 无需主动扩展边界外内容。

文档语言要求：
1. 生成或修改仓库文档、配置说明、README、AGENTS.md 时，默认使用简体中文；除非用户明确要求英文，否则不要生成英文文档。
2. 执行 /init 生成 AGENTS.md 时，标题、章节名、正文和示例说明均使用简体中文。
"""

# 用途：
# 控制模型以较低成本完成轻量任务

# 当前策略：
# - 快速响应
# - 最小解释
# - 最小必要修改

# 适用场景：
# - 文档整理
# - 格式转换
# - 简单脚本
# - 轻量代码生成和低风险批处理任务

# 可调整场景：
# - 复杂业务逻辑：切换到 dev-main.toml
# - 高风险修复或排查：切换到 dev-debug.toml

review_model = "gpt-5.2"
model_reasoning_effort = "low"
disable_response_storage = true
personality = "pragmatic"

[features]
fast_mode = true
responses_websockets_v2 = false
memories = false
multi_agent = false
